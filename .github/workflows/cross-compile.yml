name: Cross-compile

# Builds the cross-module integration example for every OS/arch we claim to
# support, proving the whole family composes and links on each platform.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT recursive: each library vendors the shared UI as web/vendor/go,
          # which points back at this aggregator, so the submodule graph is
          # cyclic (go -> opencv -> go -> ...). Recursing walks that cycle until
          # the job exhausts. Only the top-level library modules are needed to
          # build Go code. (Same reasoning as sync-submodules.yml.)
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      # go.work is committed — nothing to initialise here.
      # examples/integration no longer exists — the examples were reorganised into one
      # self-contained module per library (examples/<lib>/), each consuming the PUBLISHED
      # module rather than the workspace. Iterate the committed go.work members instead;
      # that is the set this job actually cares about.
      - name: Cross-compile every workspace member
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          while read -r dir; do
            echo "::group::$GOOS/$GOARCH $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
