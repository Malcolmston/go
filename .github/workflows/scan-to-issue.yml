name: Scan to issue

# Weekly govulncheck over the cross-module workspace example. If it reports
# vulnerabilities, open (or update) a tracking issue; close it when clean again.

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT recursive: each library vendors the shared UI as web/vendor/go,
          # which points back at this aggregator, so the submodule graph is
          # cyclic (go -> opencv -> go -> ...). Recursing walks that cycle until
          # the job exhausts. Only the top-level library modules are needed to
          # build Go code. (Same reasoning as sync-submodules.yml.)
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      - name: Run govulncheck (workspace)
        id: scan
        run: |
          # go.work is committed — nothing to initialise here.
          # Pinned: v1.2.0+ needs Go >= 1.25 and this workspace mandates 1.24.7
          # with GOTOOLCHAIN=local. The vuln DB is fetched at run time, so findings
          # stay current. Bump when the workspace moves to Go >= 1.25.
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          # examples/integration no longer exists; scan every committed go.work
          # member and concatenate the reports. The step's exit code is the worst
          # of the runs, so a finding anywhere still opens an issue.
          worst=0
          : > govuln.txt
          while read -r dir; do
            echo "=== $dir ===" >> govuln.txt
            (cd "$dir" && "$(go env GOPATH)/bin/govulncheck" ./...) >> govuln.txt 2>&1
            rc=$?
            [ "$rc" -gt "$worst" ] && worst=$rc
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
          echo "code=$worst" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          SCAN_CODE: ${{ steps.scan.outputs.code }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const clean = process.env.SCAN_CODE === '0';
            const label = 'automated-scan';
            const title = 'Security scan: govulncheck findings';
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Opened automatically by the scheduled security scan' }); }
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label })).data
              .filter(i => i.title === title);
            if (clean) {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: '✅ govulncheck is clean again — closing.' });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
              return;
            }
            let out = fs.readFileSync('govuln.txt', 'utf8');
            if (out.length > 55000) out = out.slice(0, 55000) + '\n... (truncated)';
            const body = `govulncheck reported vulnerabilities on the scheduled workspace scan.\n\n\`\`\`\n${out}\n\`\`\`\n\n_Filed automatically by Scan to issue (run ${context.runId})._`;
            if (open.length) {
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], body });
            }
