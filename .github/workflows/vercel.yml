name: Vercel

# Deploys the go aggregator (Next app at the repo root) to Vercel on every push
# to main. The whole landing plus every library's bundled API docs (public/docs/*.json ->
# the app) ship together, so the Vercel deployment is fully self-contained
# and needs nothing from GitHub to read the docs. Coexists with the GitHub
# Pages deploy (pages.yml); the Next app builds at the repo root on Vercel
# and exports under '/go' on Pages.
#
# Secrets: VERCEL_TOKEN is required. VERCEL_ORG_ID + VERCEL_PROJECT_ID are
# optional — when both are present the deterministic prebuilt flow is used
# (recommended once the project exists); otherwise the first run creates and
# links a new Vercel project non-interactively from the repo root.

# THIS WORKFLOW IS THE ONLY DEPLOY PATH. vercel.json sets
# git.deploymentEnabled.main = false, turning off Vercel's own Git integration,
# because that integration clones RECURSIVELY and THE SUBMODULE GRAPH IS CYCLIC:
# 33 of the 39 libraries vendor this aggregator back as web/vendor/go, so
#
#   go -> express -> go -> express -> ...
#
# never terminates. Measured from a clean machine:
#
#   git clone --depth 1 --no-recurse-submodules   ->  15 s, 41 MB, done
#   git clone --depth 1 --recurse-submodules      ->  still going at 240 s, 149 MB
#
# Every Git-integration build therefore sat on "Cloning github.com/Malcolmston/go"
# until it hit the 45-minute build limit and errored, with a three-line log that
# never reached the install step. It is a cycle, not merely a big repo — raising
# the timeout or shallow-cloning would not have helped.
#
# actions/checkout does not fetch submodules by default, so this path clones in
# seconds. The web build needs no submodule source anyway: each library's API
# docs are committed under public/docs/, and the import edges the graph derives
# from Go source are cached in data/import-edges.json for exactly this reason.
#
# If you ever re-enable the Git integration, disable submodule fetching first, or
# the 45-minute timeouts come straight back. Workflows that DO need the library
# sources use `submodules: true` (one level), never `recursive`.

on:
  push:
    branches: ["main"]
    # Anything the built site is derived from belongs here. The generators read
    # more than the app source: scripts/build-graph-data.ts reads public/docs/,
    # examples/, parity/ and data/import-edges.json, and build-security-data.ts
    # reads parity/*/security.json plus each library's VERSION. A parity re-run or
    # a new security manifest changes what the site SHOWS, so it has to deploy;
    # before this list included them, those commits silently never shipped.
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "ui/**"
      - "api/**"
      - "scripts/**"
      - "parity/**"
      - "data/**"
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "next.config.mjs"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "vercel"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22 (not 20): package.json declares `engines.node >= 22.6.0`, and
      # `vercel build` runs the project's own build with whatever Node is on the
      # runner. It is also the floor for `--experimental-strip-types`, which the
      # reindex step below needs, so one setup-node serves both.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          # setup-node@v5 turned package-manager caching ON by default. It reads
          # `packageManager` from package.json, sees pnpm, and shells out to pnpm
          # to find its store — but pnpm is not on PATH yet (the reindex step
          # enables it via corepack further down), so the step fails with
          # "Unable to locate executable file: pnpm" before anything is built.
          # Nothing here needs the cache: the deploy step installs through the
          # Vercel CLI, and the reindex step's install is a single cold install.
          package-manager-cache: false

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using linked project ($VERCEL_PROJECT_ID) — prebuilt flow."
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            echo "No VERCEL_ORG_ID/VERCEL_PROJECT_ID — creating/linking a project from the repo root (first run)."
            url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          fi
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Reindex Upstash Search AFTER a successful production deploy. This is the
      # PRIMARY freshness mechanism: the symbol corpus (api/_data/symbols.json)
      # only changes at build time, so we reindex once here rather than relying
      # on the safety-net Vercel Cron. symbols.json is gitignored (generated), so
      # we regenerate it with `pnpm build:graph` before indexing. Guarded to only
      # run on main and only when the deploy actually produced a URL.
      - name: Reindex symbols (Upstash Search)
        if: github.ref == 'refs/heads/main' && steps.deploy.outputs.url != ''
        env:
          UPSTASH_SEARCH_REST_URL: ${{ secrets.UPSTASH_SEARCH_REST_URL }}
          UPSTASH_SEARCH_REST_TOKEN: ${{ secrets.UPSTASH_SEARCH_REST_TOKEN }}
          # Required: `@awesome.me/kit-*` resolves from the Font Awesome Pro
          # registry (.npmrc). Without the token `pnpm install` 401s and the
          # reindex fails after a successful deploy.
          FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
        run: |
          set -e
          if [ -z "$UPSTASH_SEARCH_REST_URL" ] || [ -z "$UPSTASH_SEARCH_REST_TOKEN" ]; then
            echo "Upstash Search secrets not set — skipping reindex (search falls back to in-memory BM25)."
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:graph      # regenerates api/_data/symbols.json (gitignored)
          pnpm index:symbols
