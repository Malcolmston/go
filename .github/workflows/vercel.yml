name: Vercel

# Deploys the go aggregator (Next app at the repo root) to Vercel on every push
# to main. The whole landing plus every library's bundled API docs (public/docs/*.json ->
# the app) ship together, so the Vercel deployment is fully self-contained
# and needs nothing from GitHub to read the docs. Coexists with the GitHub
# Pages deploy (pages.yml); the Next app builds at the repo root on Vercel
# and exports under '/go' on Pages.
#
# Secrets: VERCEL_TOKEN is required. VERCEL_ORG_ID + VERCEL_PROJECT_ID are
# optional — when both are present the deterministic prebuilt flow is used
# (recommended once the project exists); otherwise the first run creates and
# links a new Vercel project non-interactively from the repo root.

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "src/**"
      - "public/**"
      - "ui/**"
      - "api/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "vercel"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: vercel-production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Using linked project ($VERCEL_PROJECT_ID) — prebuilt flow."
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            echo "No VERCEL_ORG_ID/VERCEL_PROJECT_ID — creating/linking a project from the repo root (first run)."
            url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          fi
          echo "Deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Reindex Upstash Search AFTER a successful production deploy. This is the
      # PRIMARY freshness mechanism: the symbol corpus (api/_data/symbols.json)
      # only changes at build time, so we reindex once here rather than relying
      # on the safety-net Vercel Cron. symbols.json is gitignored (generated), so
      # we regenerate it with `pnpm build:graph` before indexing. Guarded to only
      # run on main and only when the deploy actually produced a URL. Runs on
      # Node 22 because `--experimental-strip-types` (used by build:graph /
      # index:symbols) requires Node >= 22.6.0 — the deploy step above pins 20.
      - name: Set up Node 22 (for reindex)
        if: github.ref == 'refs/heads/main' && steps.deploy.outputs.url != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Reindex symbols (Upstash Search)
        if: github.ref == 'refs/heads/main' && steps.deploy.outputs.url != ''
        env:
          UPSTASH_SEARCH_REST_URL: ${{ secrets.UPSTASH_SEARCH_REST_URL }}
          UPSTASH_SEARCH_REST_TOKEN: ${{ secrets.UPSTASH_SEARCH_REST_TOKEN }}
        run: |
          set -e
          if [ -z "$UPSTASH_SEARCH_REST_URL" ] || [ -z "$UPSTASH_SEARCH_REST_TOKEN" ]; then
            echo "Upstash Search secrets not set — skipping reindex (search falls back to in-memory BM25)."
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:graph      # regenerates api/_data/symbols.json (gitignored)
          pnpm index:symbols
