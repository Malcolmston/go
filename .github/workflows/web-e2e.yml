name: Web e2e

# Playwright end-to-end tests for the landing site across the device matrix.
#
# Pull requests and pushes to main run the default device subset across 2 shards
# to keep wall-clock low. The nightly schedule and manual dispatch opt in to the
# full 100+ device matrix (E2E_FULL=1) across 4 shards for exhaustive coverage.
#
# The production build is its own step, before Playwright starts. It is not
# welded into the webServer command: that build peaks around 2.4 GB RSS and,
# inside webServer, its output is swallowed and its failures surface only as a
# server-start timeout.

on:
  pull_request:
    paths: ["app/**", "src/**", "tests/**", "public/**", "ui/**", "package.json", "pnpm-lock.yaml", "next.config.mjs", "tsconfig*.json", "playwright.config.ts", ".eslintrc.json", ".github/workflows/web-e2e.yml"]
  push:
    branches: ["main"]
    paths: ["app/**", "src/**", "tests/**", "public/**", "ui/**", "package.json", "pnpm-lock.yaml", "next.config.mjs", "tsconfig*.json", "playwright.config.ts", ".eslintrc.json", ".github/workflows/web-e2e.yml"]
  schedule:
    # Nightly full-matrix sweep (06:00 UTC).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compute the run shape once: scheduled and manual runs get the full device
  # matrix + 4 shards, everything else (PRs, pushes to main) the subset + 2.
  config:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - id: plan
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo 'shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
              echo 'total=4' >> "$GITHUB_OUTPUT"
              echo 'full=1' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo 'shards=[1,2]' >> "$GITHUB_OUTPUT"
              echo 'total=2' >> "$GITHUB_OUTPUT"
              echo 'full=0' >> "$GITHUB_OUTPUT"
              ;;
          esac

  playwright:
    needs: config
    name: Playwright E2E (shard ${{ matrix.shard }}/${{ needs.config.outputs.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.config.outputs.shards) }}
    env:
      E2E_FULL: ${{ needs.config.outputs.full }}
      FONTAWESOME_PACKAGE_TOKEN: ${{ secrets.FONTAWESOME_PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-go@v7
        with: { go-version-file: go.work, cache: true }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
        timeout-minutes: 15
      - name: Run E2E (shard ${{ matrix.shard }}/${{ needs.config.outputs.total }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ needs.config.outputs.total }}
        timeout-minutes: 45
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
