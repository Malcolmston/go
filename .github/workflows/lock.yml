name: Lock threads

# Locks issues and pull requests after a long period of inactivity so stale
# threads don't accrue drive-by comments. Scheduled only.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock-threads
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      # v6, not v5: v5 validates that github-token is at most 100 characters, and
      # GitHub's generated GITHUB_TOKEN is now longer than that, so every run failed
      # with '"github-token" length must be less than or equal to 100 characters
      # long' before doing any work. Nothing here passes a token explicitly — it is
      # the action's own default that trips the check. v6 also runs on Node 24,
      # clearing the Node 20 deprecation warning.
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: "180"
          pr-inactive-days: "180"
          process-only: "issues, prs"
