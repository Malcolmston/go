name: Workspace

# Proves the libraries compose: builds and vets the cross-module go.work
# integration example (examples/integration) with every library submodule.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: workspace build (cross-module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT recursive: each library vendors the shared UI as web/vendor/go,
          # which points back at this aggregator, so the submodule graph is
          # cyclic (go -> opencv -> go -> ...). Recursing walks that cycle until
          # the job exhausts. Only the top-level library modules are needed to
          # build Go code. (Same reasoning as sync-submodules.yml.)
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      # go.work is committed at the repo root and is the single source of truth
      # for workspace membership (`go work init` here would fail with "go.work
      # already exists"). Guard against a member directory that the submodule
      # checkout left empty — without this, `go build` reports a confusing
      # "does not contain modules" instead of "submodules were not fetched".
      - name: Verify every workspace member is checked out
        run: |
          set -euo pipefail
          missing=0
          while read -r dir; do
            [ -f "$dir/go.mod" ] || { echo "::error::workspace member $dir has no go.mod (submodule not checked out?)"; missing=1; }
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
          exit $missing
      - name: Build every workspace member
        run: |
          set -euo pipefail
          while read -r dir; do
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
      - name: Vet every workspace member
        run: |
          set -euo pipefail
          while read -r dir; do
            echo "::group::go vet $dir"
            (cd "$dir" && go vet ./...)
            echo "::endgroup::"
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
