name: Govulncheck

# Scans the cross-module integration example (and everything it imports across
# the family) for known vulnerabilities. Scheduled so newly disclosed CVEs are
# caught even when nothing changed; not a PR gate.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT recursive: each library vendors the shared UI as web/vendor/go,
          # which points back at this aggregator, so the submodule graph is
          # cyclic (go -> opencv -> go -> ...). Recursing walks that cycle until
          # the job exhausts. Only the top-level library modules are needed to
          # build Go code. (Same reasoning as sync-submodules.yml.)
          submodules: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false
      # go.work is committed — nothing to initialise here.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # examples/integration no longer exists — the examples were reorganised into one
      # self-contained module per library (examples/<lib>/), each consuming the PUBLISHED
      # module rather than the workspace. Iterate the committed go.work members instead;
      # that is the set this job actually cares about.
      - name: Scan every workspace member
        run: |
          set -euo pipefail
          while read -r dir; do
            echo "::group::govulncheck $dir"
            (cd "$dir" && govulncheck ./...)
            echo "::endgroup::"
          done < <(go work edit -json | jq -r '.Use[].DiskPath')
