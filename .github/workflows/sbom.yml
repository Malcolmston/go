name: SBOM

# Generates a CycloneDX software bill of materials for the aggregator and
# uploads it as a build artifact. Runs on release-relevant events; not a PR gate.

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # NOT recursive: each library vendors the shared UI as web/vendor/go,
          # which points back at this aggregator, so the submodule graph is
          # cyclic (go -> opencv -> go -> ...). Recursing walks that cycle until
          # the job exhausts. Only the top-level library modules are needed to
          # build Go code. (Same reasoning as sync-submodules.yml.)
          submodules: true
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
